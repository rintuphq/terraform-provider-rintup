# Nightly acceptance tests against a dedicated RintUp test workspace. They create and destroy
# real monitors, a contact group, a channel, a maintenance window and a status page.
#
# Secret: RINTUP_API_KEY (key of the test workspace); without it the run is skipped.
# Optional repository variable: RINTUP_BASE_URL.
name: acceptance

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance # one run at a time: the tests share one workspace

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.RINTUP_API_KEY != '' }}
    steps:
      - name: Skip without RINTUP_API_KEY
        if: env.HAS_KEY != 'true'
        run: echo "RINTUP_API_KEY secret not set; acceptance tests skipped."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-go@v6
        if: env.HAS_KEY == 'true'
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        if: env.HAS_KEY == 'true'
        with:
          terraform_version: "1.11.*"
          terraform_wrapper: false
      - run: go test ./internal/provider -run TestAcc -v -timeout 25m
        if: env.HAS_KEY == 'true'
        env:
          TF_ACC: "1"
          RINTUP_API_KEY: ${{ secrets.RINTUP_API_KEY }}
          RINTUP_BASE_URL: ${{ vars.RINTUP_BASE_URL || 'https://rintup.com/api/v1' }}
